name: Android CI

# 1. 触发条件：当代码推送到 main 分支，或者有人提交 Pull Request 到 main 分支时触发
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 2. 执行任务
jobs:
  build:
    runs-on: ubuntu-latest  # 使用最新的 Ubuntu 虚拟机作为运行环境

    steps:
      # 步骤 1: 拉取代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 步骤 2: 配置 JDK 环境
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'       # 根据你的项目要求，这里使用的是 JDK 17
          distribution: 'temurin'  # 使用 Eclipse Temurin 发行版
          cache: gradle            # 开启 Gradle 缓存，大幅加快后续构建速度

      # 步骤 3: 赋予 Gradle 执行权限
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 步骤 4: 构建 Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 步骤 5: 上传生成的 APK 作为构建产物（保留 7 天）
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cctv-view-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
