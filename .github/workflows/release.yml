name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  Build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "SDK_ROOT=$SDK_ROOT"
          if [ -d "$SDK_ROOT/platforms/android-36" ] && [ -d "$SDK_ROOT/build-tools" ]; then
            echo "SDK ready, skip install"
            exit 0
          fi
          echo "SDK incomplete, installing..."
          mkdir -p "$SDK_ROOT/cmdline-tools"
          cd /tmp
          # 逐个尝试可用版本（Google 会下线旧版 cmdline-tools，多备几个版本 + 重试）
          for V in 13114758 11076708 12266719 10406996; do
            URL="https://dl.google.com/android/repository/commandlinetools-linux-${V}_latest.zip"
            echo "try download: $URL"
            if curl -fsSL --retry 3 --retry-delay 5 -o clt.zip "$URL"; then
              echo "downloaded version $V"
              break
            fi
          done
          unzip -q -o clt.zip -d "$SDK_ROOT/cmdline-tools"
          rm -rf "$SDK_ROOT/cmdline-tools/latest"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0"

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > app/android_ca

      - name: Build Release APK
        run: |
          bash ./gradlew assembleRelease
        env:
          KEYSTORE_FILE: android_ca
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK with tag name
        run: |
          TAG_NAME="${{ github.ref_name }}"
          APK_DIR="app/build/outputs/apk/release"
          if [ -f "$APK_DIR/app-release.apk" ]; then
            mv "$APK_DIR/app-release.apk" "$APK_DIR/com.raysonstudio.cctv_view_${TAG_NAME}.apk"
          else
            FIRST_APK=$(find "$APK_DIR" -maxdepth 1 -name "*.apk" | head -n 1)
            if [ -n "$FIRST_APK" ]; then
              mv "$FIRST_APK" "$APK_DIR/com.raysonstudio.cctv_view_${TAG_NAME}.apk"
            fi
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/com.raysonstudio.cctv_view_*.apk
