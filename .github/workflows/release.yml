name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  Build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > app/android_ca

      - name: Build Release APK
        run: |
          bash ./gradlew assembleRelease
        env:
          KEYSTORE_FILE: android_ca
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK with tag name
        run: |
          TAG_NAME="${{ github.ref_name }}"
          APK_DIR="app/build/outputs/apk/release"
          if [ -f "$APK_DIR/app-release.apk" ]; then
            mv "$APK_DIR/app-release.apk" "$APK_DIR/com.raysonstudio.cctv_view_${TAG_NAME}.apk"
          else
            FIRST_APK=$(find "$APK_DIR" -maxdepth 1 -name "*.apk" | head -n 1)
            if [ -n "$FIRST_APK" ]; then
              mv "$FIRST_APK" "$APK_DIR/com.raysonstudio.cctv_view_${TAG_NAME}.apk"
            fi
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/com.raysonstudio.cctv_view_*.apk
