name: 功能建议
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 相关问题
      description: 你的建议是为了解决什么问题？
      placeholder: "每次切换频道都要..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望如何解决？描述你设想的功能行为
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过的其他解决方式
  - type: textarea
    id: additional
    attributes:
      label: 补充说明
      description: 任何其他背景信息、参考链接、截图等
  - type: checkboxes
    id: terms
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 Issue，确认没有重复
          required: true
        - label: 我已阅读 CONTRIBUTING.md
          required: true
