name: Bug 反馈
description: 报告一个问题以帮助改进本项目
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你花时间反馈问题！请尽量填写以下信息，以便我们快速定位。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 简要说明发生了什么问题
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 你做了哪些操作后触发了问题？
      placeholder: |
        1. 打开应用
        2. 按下方向键切换到 CCTV-...
        3. 看到 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你原本期望发生什么？
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: 应用版本
      description: 可在 设置 - 应用 - 央视网 中查看，或参考 Release 页面
      placeholder: "v2.0"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备型号
      placeholder: "小米电视 S85 Mini LED"
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: 系统版本
      placeholder: "Xiaomi HyperOS 3.0.103.0"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 可选。请粘贴 ADB logcat 关键片段或附上截图链接
      render: shell
  - type: checkboxes
    id: terms
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 Issue，确认没有重复
          required: true
        - label: 我已阅读 CONTRIBUTING.md
          required: true
