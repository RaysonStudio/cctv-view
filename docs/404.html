<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>页面走丢了 · 央视网 TV</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#07080c">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/styles.css">
  <style>
    .notfound {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 40px 20px;
      text-align: center;
    }
    .notfound-code {
      font-family: var(--font-mono);
      font-size: clamp(90px, 22vw, 180px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.06em;
      color: transparent;
      -webkit-text-stroke: 1px rgba(255, 255, 255, 0.16);
      background: linear-gradient(120deg, rgba(255, 61, 81, 0.5), transparent 60%);
      -webkit-background-clip: text;
      background-clip: text;
    }
    .notfound h1 {
      margin: 18px 0 12px;
      font-size: clamp(30px, 5vw, 44px);
    }
    .notfound p {
      max-width: 420px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
    }
    .notfound .btn {
      margin-top: 28px;
    }
  </style>
</head>
<body>
  <main class="notfound">
    <div>
      <p class="notfound-code">404</p>
      <h1>这个频道不存在</h1>
      <p>你访问的页面可能已被移动或删除。回到首页，继续看直播吧。</p>
      <a class="btn btn-primary" href="./">回到首页</a>
    </div>
  </main>
</body>
</html>
